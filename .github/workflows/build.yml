name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar proyecto
        id: proj
        run: |
          rm -rf _src
          if [ -f settings.gradle.kts ]; then
            dir=.
          else
            z=$(find . -maxdepth 2 -iname 'JullBook*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$z" ]; then
              echo "No hay settings.gradle.kts ni JullBook*.zip. Contenido:"
              find . -maxdepth 3 -not -path './.git/*' | head -50
              exit 1
            fi
            echo "Descomprimiendo $z"
            mkdir _src
            unzip -q "$z" -d _src
            f=$(find _src -name settings.gradle.kts | head -n 1)
            if [ -z "$f" ]; then
              echo "El ZIP no contiene settings.gradle.kts"
              find _src -maxdepth 3 | head -50
              exit 1
            fi
            dir=$(dirname "$f")
          fi
          echo "Proyecto en: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Preparar Gradle Wrapper
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Compilar APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JullBook-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-gradle
          path: "**/build/reports/**"
          if-no-files-found: ignore
