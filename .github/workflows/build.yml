name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir ZIP si hace falta
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "Descomprimiendo $z"
              mkdir -p _src
              unzip -q "$z" -d _src
            fi
          fi

      - name: Localizar proyecto
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "No se encontró settings.gradle.kts. Contenido del repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "Proyecto en: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Preparar Gradle Wrapper
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Compilar APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      -
